[package]
name = "nexdownload-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NexDownload desktop shell (Tauri 2)"

[lib]
name = "nexdownload_desktop_lib"
# Desktop-only build. Tauri adds staticlib/cdylib for mobile targets; keeping
# only rlib also avoids the Windows gnullvm 65,535-export linker limit.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum.workspace = true
directories.workspace = true
download-api = { path = "../../../crates/download-api" }
download-storage = { path = "../../../crates/download-storage" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
