name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust format, lint, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  extension:
    name: Browser extension syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check apps/browser-extension/background.js
          node --check apps/browser-extension/popup.js
          node --check apps/browser-extension/options.js

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('apps/browser-extension/manifest.json', 'utf8'))"

  e2e:
    name: Playwright web client
    runs-on: ubuntu-latest
    env:
      NEXDOWNLOAD_E2E_URL: http://127.0.0.1:47821
      NEXDOWNLOAD_E2E_API: http://127.0.0.1:47821
      NEXDOWNLOAD_E2E_TOKEN: e2e-token-0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Build headless server
        run: cargo build -p nexdownload-server

      - name: Install Chromium
        working-directory: apps/desktop
        run: npx playwright install --with-deps chromium

      - name: Start headless server
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/nexdownload-e2e"
          nohup ./target/debug/nexdownloadd \
            --data-dir "$RUNNER_TEMP/nexdownload-e2e" \
            --frontend apps/desktop/dist \
            --token "$NEXDOWNLOAD_E2E_TOKEN" \
            > "$RUNNER_TEMP/nexdownload-e2e/server.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:47821/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/nexdownload-e2e/server.log"
          exit 1

      - name: Run Playwright
        working-directory: apps/desktop
        run: npm run test:e2e

      - name: Show server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/nexdownload-e2e/server.log" || true

  desktop:
    name: Tauri desktop check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check Tauri shell
        run: cargo check -p nexdownload-desktop
